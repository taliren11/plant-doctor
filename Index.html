
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plant Doctor 🌱</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="logo">🌱</div>
            <h1>Plant Doctor</h1>
            <p>AI-powered plant disease detection</p>
        </div>

        <div class="upload-box">
            <h2>📷 Upload a Leaf</h2>

            <p>
                Take a clear picture of a plant leaf and upload it
                to identify possible diseases.
            </p>

            <input type="file" id="imageInput" accept="image/*">

            <img id="preview" alt="Leaf preview">

            <button id="analyzeButton">
                🔍 Analyze Plant
            </button>
        </div>

        <div class="result-box">

            <h2>🧠 Diagnosis</h2>

            <div id="result">
                Upload a leaf image to begin.
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
