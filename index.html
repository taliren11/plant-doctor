```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plant Doctor</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
</head>

<body>

    <main class="app-container">

        <h1>🌱 Plant Doctor</h1>

        <p class="subtitle">
            Take a picture of your plant leaf and let AI check its health.
        </p>

        <!-- Image Preview -->
        <div class="preview-container">
            <img id="preview" alt="Selected leaf">
        </div>

        <!-- Camera Button -->
        <button id="cameraButton" class="upload-button" type="button">
            📷 Take a Picture
        </button>

        <!-- Upload Button -->
        <label for="imageInput" class="upload-button">
            📁 Upload File
        </label>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <!-- Analyze Button -->
        <button id="analyzeButton" type="button" disabled>
            🔍 Analyze Leaf
        </button>

        <!-- Loading -->
        <p id="loading" style="display: none;">
            🌿 Analyzing your leaf...
        </p>

        <!-- Results -->
        <section id="result" style="display: none;">

            <h2>🩺 Diagnosis</h2>

            <h3 id="disease"></h3>

            <p id="confidence"></p>

            <div class="advice-card">
                <h3>💊 Treatment</h3>
                <p id="treatment"></p>
            </div>

            <div class="advice-card">
                <h3>🛡️ Prevention</h3>
                <p id="prevention"></p>
            </div>

        </section>

    </main>


    <!-- ========================= -->
    <!-- CAMERA MODAL -->
    <!-- ========================= -->

    <div id="cameraModal" class="camera-modal">

        <div class="camera-box">

            <video
                id="cameraVideo"
                autoplay
                playsinline
                muted
            ></video>

            <canvas id="cameraCanvas" hidden></canvas>

            <div class="camera-controls">

                <button
                    id="captureButton"
                    type="button"
                >
                    📸 Capture
                </button>

                <button
                    id="switchCameraButton"
                    type="button"
                >
                    🔄 Switch Camera
                </button>

                <button
                    id="closeCameraButton"
                    type="button"
                >
                    ✕ Close
                </button>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- TENSORFLOW + TEACHABLE MACHINE -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <!-- Your JavaScript -->
```
